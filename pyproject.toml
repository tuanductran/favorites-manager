[project]
name = "favorites-manager"
version = "0.1.0"
description = "Quản lý favorites/bookmarks trên nhiều trình duyệt: gộp, lọc trùng, phân loại folder, xuất HTML để import lại vào trình duyệt."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8.1",
    "rich>=13.7",
    "requests>=2.31",
]

[project.scripts]
favorites = "favorites_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/favorites_manager"]
